<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Links</title>
<style>
:root {
  --bg: #000;
  --card: #0a0a0a;
  --card-hover: rgba(0, 229, 255, 0.06);
  --accent: #00e5ff;
  --accent-dim: rgba(0, 229, 255, 0.65);
  --text: #f5f5f5;
  --muted: #9aa0a6;
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(0, 229, 255, 0.35);
  --glow: rgba(0, 229, 255, 0.22);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  max-width: 960px;
  max-height: 480px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar .title {
  flex: 1;
  font-size: 14px;
  letter-spacing: 0.4px;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .count {
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
}

.hint {
  padding: 6px 14px 8px;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
  text-align: center;
}

.entries {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.entries::-webkit-scrollbar { width: 3px; }
.entries::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}

.entry {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  margin: 4px 2px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.entry:active {
  background: var(--card-hover);
  border-color: var(--border-hover);
  box-shadow: 0 0 10px var(--glow);
}
.entry .idx {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border-radius: 50%;
  background: rgba(0, 229, 255, 0.08);
  color: var(--accent-dim);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}
.entry .info {
  flex: 1;
  min-width: 0;
}
.entry .title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
/* Compact type badge that sits next to the host line. We deliberately
   don't make it loud — the user's eye should land on the title first;
   the badge is a sub-cue for "what is this thing". */
.entry .meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--accent-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry .badge {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(0, 229, 255, 0.12);
  color: var(--accent);
  flex-shrink: 0;
}
.entry .badge.video    { background: rgba(255, 45, 85, 0.15);  color: #ff7090; }
.entry .badge.podcast  { background: rgba(155, 89, 255, 0.15); color: #c4a3ff; }
.entry .badge.audio    { background: rgba(255, 187, 51, 0.15); color: #ffd066; }
.entry .badge.article  { background: rgba(255, 255, 255, 0.10); color: #d8d8d8; }
.entry .badge.pdf      { background: rgba(255, 100, 100, 0.15); color: #ffaaaa; }
.entry .badge.image    { background: rgba(120, 220, 120, 0.15); color: #b0e8b0; }
.entry .badge.web      { background: rgba(0, 229, 255, 0.12);  color: var(--accent); }
.entry .host {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry .summary {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry .chev {
  font-size: 14px;
  color: var(--muted);
  margin-top: 2px;
  flex-shrink: 0;
}

.empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="title" id="list-title">Links</div>
    <div class="count" id="list-count"></div>
  </div>
  <div class="hint">Tap a link to open it. Articles &amp; PDFs open in the browser; audio and video play in the appropriate viewer.</div>
  <div class="entries" id="entries"></div>

<script>
(function () {
  'use strict';

  function parseData() {
    try {
      var qs = window.location.search || '';
      if (qs.charAt(0) === '?') qs = qs.substring(1);
      var pairs = qs.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var eq = pairs[i].indexOf('=');
        if (eq < 0) continue;
        var k = decodeURIComponent(pairs[i].substring(0, eq));
        if (k === 'data') {
          var v = decodeURIComponent(pairs[i].substring(eq + 1).replace(/\+/g, ' '));
          return JSON.parse(v);
        }
      }
    } catch (e) { console.warn('link_list: failed to parse ?data', e); }
    return null;
  }

  function hostOf(url) {
    try {
      var u = new URL(url);
      return u.hostname.replace(/^www\./, '');
    } catch (e) {
      return url;
    }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // The set of types we recognise visually. Anything else falls back to
  // "web" so the badge still renders cleanly. Keep this list aligned with
  // CardUrlExtractor.MediaType on the Kotlin side.
  var KNOWN_TYPES = ['video', 'podcast', 'audio', 'article', 'pdf', 'image', 'web'];
  function normaliseType(t) {
    var lower = String(t || '').trim().toLowerCase();
    return KNOWN_TYPES.indexOf(lower) >= 0 ? lower : 'web';
  }

  function render(data) {
    var title = (data && data.title) || (data && data.topic) || 'Links';
    var links = (data && Array.isArray(data.links)) ? data.links : [];

    document.getElementById('list-title').textContent = title;
    document.getElementById('list-count').textContent =
      links.length ? (links.length + ' links') : '';

    var container = document.getElementById('entries');
    container.innerHTML = '';
    if (!links.length) {
      var empty = el('div', 'empty', 'No links to show.');
      container.appendChild(empty);
      return;
    }

    links.forEach(function (l, i) {
      var row = el('div', 'entry');
      row.appendChild(el('div', 'idx', String(i + 1)));

      var info = el('div', 'info');
      var t = (l && l.title) ? String(l.title) : 'Untitled';
      var u = (l && l.url) ? String(l.url) : '';
      var s = (l && l.summary) ? String(l.summary) : '';
      var type = normaliseType(l && l.type);

      info.appendChild(el('div', 'title', t));

      var meta = el('div', 'meta');
      meta.appendChild(el('span', 'badge ' + type, type));
      meta.appendChild(el('span', 'host', hostOf(u)));
      info.appendChild(meta);

      if (s) info.appendChild(el('div', 'summary', s));

      row.appendChild(info);
      row.appendChild(el('div', 'chev', '›'));

      // Direct navigation. TapBrowser's WebView handles the URL exactly
      // the same way as if the user had typed it in the address bar.
      // Type-aware routing (audio → media_player.html, video → YouTube
      // autoplay, etc.) happens in TapBrowser's URL interceptor, not
      // here, so this stays a thin tap-to-open page.
      row.addEventListener('click', function () {
        if (u) window.location.href = u;
      });
      container.appendChild(row);
    });
  }

  var data = parseData();
  if (!data) {
    data = { title: 'Links', topic: '', links: [] };
  }
  render(data);
})();
</script>
</body>
</html>
