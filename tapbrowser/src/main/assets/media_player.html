// ──────────────────────────────────────────────────────────────────
// Text cleanup for cloud TTS synthesis
//
// Fish.audio's voice models — especially the realistic ones — read
// many decorative ASCII characters literally. So `***`, `_emphasis_`,
// and `[Illustration]` get spoken as "asterisk asterisk asterisk",
// "underline emphasis underline", and "open bracket Illustration
// close bracket" respectively. Fish.audio's docs recommend
// preprocessing user text to strip Markdown / decorative characters
// before sending it to /v1/tts; their normalize parameter only
// handles loudness, not text.
//
// We strip:
//   * Markdown emphasis: **bold**, *italic*, _underline_, __bold__
//   * Decorative runs: ***, ___, ---, === (pure formatting, not speech)
//   * Bracketed metadata: [Illustration], [pause], [chapter] — these
//     are Project Gutenberg / EPUB conventions for non-prose markers
//   * Backtick code fences and inline code marks
//   * Repeated/excess whitespace from the above strips
//
// Controlled by a Fish-only pref `fish_clean_text` (default true).
// Pulled from URL param at page load; the companion app writes it.
// ──────────────────────────────────────────────────────────────────
var ttsCleanForSynth = (function() {
  var raw = (params.get('clean') || '').toLowerCase();
  if (raw === 'false' || raw === '0') return false;
  return true;        // default on — most users want clean readout
})();

function cleanTextForSynth(s) {
  if (!s || !ttsCleanForSynth) return s;
  return s
    // Bold/italic/underline emphasis. Order matters: capture bold (**…**
    // and __…__) before single-mark italic (*…* and _…_) so we don't
    // half-strip the inner markers and leave a stray * or _.
    .replace(/\*\*([^*]+?)\*\*/g, '$1')
    .replace(/__([^_]+?)__/g, '$1')
    .replace(/\*([^*\n]+?)\*/g, '$1')
    .replace(/_([^_\n]+?)_/g, '$1')
    // Pure decorative runs (Project Gutenberg uses *** as section
    // dividers; many docs use ====/---- as h1/h2 underlines). Replace
    // with a sentence-pause-equivalent so the reader doesn't barrel
    // through where the original document had a visual break.
    .replace(/^[\s]*[*=_\-]{3,}[\s]*$/gm, '. ')
    .replace(/[*_\-=]{3,}/g, ' ')
    // Bracketed editorial metadata. Common Gutenberg / EPUB markers:
    // [Illustration], [pause], [Chapter I], [Footnote 3]. Strip them
    // so they don't get read out as nonsense.
    .replace(/\s*\[[^\]\n]{1,80}\]\s*/g, ' ')
    // Code fences (rare in plain text but common in Markdown) and
    // inline code backticks.
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`+/g, '')
    // Chunking can split Markdown pairs across synthesis boundaries,
    // leaving raw markers like `**` or `*` inside an otherwise normal
    // chunk. Strip every leftover emphasis marker before Fish can read
    // it as "asterisk" or "underscore".
    .replace(/(^|[\s([{])[*_]{1,3}(?=\S)/g, '$1')
    .replace(/(\S)[*_]{1,3}(?=$|[\s.,;:!?)}\]])/g, '$1')
    .replace(/[*_]+/g, ' ')
    // Vertical bars (Markdown table separators, ASCII frames, etc.)
    // and other decorative ASCII Fish reads literally. We strip
    // these aggressively because they're almost never meant to be
    // spoken — a column of text wrapped in `| ... |` is a layout
    // hint, not part of the prose.
    //
    // Pipe RUNS: `|---|---|` table rows, `||` boundaries → space.
    .replace(/\|+/g, ' ')
    // Tildes (often used as decorative dividers like `~~~~~`) and
    // carets (`^^^^`) and the "section sign" §. Single `~` inside
    // text is rare and almost always decorative; we collapse all
    // runs to whitespace.
    .replace(/[~^§¦]+/g, ' ')
    // Repeated whitespace gymnastics from "table-of-contents dots"
    // like ".... 12" — collapse runs of 3+ dots to an ellipsis so
    // Fish reads it as a pause rather than "dot dot dot".
    .replace(/\.{3,}/g, '… ')
    // Stray remaining Markdown markers and quote/list prefixes that
    // should never be spoken literally in readout mode.
    .replace(/[>#]+/g, ' ')
    // Collapse runs of whitespace introduced by the strips above.
    .replace(/[ \t]+/g, ' ')
    .replace(/\s*\n\s*\n\s*/g, '\n\n')
    .trim();
}

function cycleTtsSpeed() {
  var speeds = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
  var cur = speeds.indexOf(ttsRate);
  ttsRate = speeds[(cur + 1) % speeds.length];
  document.getElementById('ttsSpeed').textContent = ttsRate.toFixed(2) + '×';
  // Apply rate to BOTH pool elements live — the active one (currently
  // speaking) and the standby one (preloaded for the next chunk). The
  // <audio> element's `playbackRate` change is instantaneous and
  // pitch-preserving in modern WebKit/Blink, so no restart needed.
  // This is what was broken before: the rate variable updated but the
  // audio element never received it, so the speaker kept reading at 1×.
  try {
    var pool = ttsAudioPool;
    if (pool) {
      pool[0].playbackRate = ttsRate;
      pool[1].playbackRate = ttsRate;
      // preservesPitch is the W3C standard property; the older
      // `mozPreservesPitch` / `webkitPreservesPitch` fallbacks are
      // automatic when the standard is supported.
      pool[0].preservesPitch = true;
      pool[1].preservesPitch = true;
    }
  } catch (_) {}
}

function handleAudioLoadFailure(url) {
  var code = audioEl.error ? audioEl.error.code : '?';
  var msg  = audioEl.error ? audioEl.error.message || '' : '';
  var detail = 'code ' + code + (msg ? ': ' + msg : '');
  if (handlePlaylistTrackFailure('audio', detail, url)) return;
  showError('Could not load audio (' + detail + ').');
}

function initAudioPlayer(url) {
  diag('initAudioPlayer  url=' + (url || '').slice(0, 120));
  prepareExclusivePlayback();
  document.getElementById('audioPlayer').classList.add('active');
  document.getElementById('audioTitle').textContent = mediaTitle;
  var loadSeq = ++audioLoadSeq;
  audioEl.dataset.loadSeq = String(loadSeq);
  audioEl.src = url;
  audioEl.load();

  var seek = document.getElementById('audioSeek');
  var playBtn = document.getElementById('audioPlayBtn');

  // Spinner-clear fallbacks: `loadedmetadata` is the ideal trigger, but some
  // codec/header combinations never fire it on this WebView build — add
  // `loadeddata` and `canplay` as secondary triggers so we don't sit on the
  // spinner forever. Anything that dispatches one of these means audio is
  // actually working.
  function armedHide() {
    if (!isFinite(audioEl.duration) || audioEl.duration <= 0) {
      document.getElementById('audioTimeDur').textContent = '';
      seek.max = 100;
    } else {
      document.getElementById('audioTimeDur').textContent = fmt(audioEl.duration);
      seek.max = audioEl.duration;
    }
    hideLoading();
    if (playlistMode) playlistConsecutiveFailures = 0;
    showGestureHint();
  }
  audioEl.addEventListener('loadedmetadata', armedHide);
  audioEl.addEventListener('loadeddata',     armedHide);
  audioEl.addEventListener('canplay',        armedHide);
  audioEl.addEventListener('playing',        armedHide);
  audioEl.addEventListener('timeupdate', function() {
    if (!seek._dragging) {
      seek.value = audioEl.currentTime;
      document.getElementById('audioTimeCur').textContent = fmt(audioEl.currentTime);
    }
    // Audio files get cue tracking too (sidecar lyrics/captions or
    // embedded tracks) — rendered into the same #captionText node and
    // published for the dim-mode caption slot.
    updateCaptions(audioEl.currentTime);
  });
  audioEl.addEventListener('ended', function() {
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
    notifyMediaState(false);
  });
  audioEl.addEventListener('play', function() {
    notifyMediaState(true);
  });
  audioEl.addEventListener('pause', function() {
    if (!audioEl.ended) notifyMediaState(false);
  });
  audioEl.addEventListener('error', function(e) {
    handleAudioLoadFailure(audioEl.currentSrc || audioEl.src || url);
  });
  // Belt-and-suspenders: if nothing fires in 15s, surface the failure
  // visibly instead of leaving the user staring at a silent spinner.
  setTimeout(function(){
    if (audioEl.dataset.loadSeq === String(loadSeq) &&
        !document.getElementById('loadingOverlay').classList.contains('hidden')) {
      if (!handlePlaylistTrackFailure('audio', 'load timed out', url)) {
        showError('Audio load timed out. URL: ' + url);
      }
    }
  }, 15000);

  seek.addEventListener('mousedown', function(){ seek._dragging = true; });
  seek.addEventListener('touchstart', function(){ seek._dragging = true; });
  seek.addEventListener('input', function() {
    document.getElementById('audioTimeCur').textContent = fmt(parseFloat(this.value));
  });
  seek.addEventListener('change', function() {
    audioEl.currentTime = parseFloat(this.value);
    seek._dragging = false;
  });

  playBtn.addEventListener('click', function() { toggleAudio(); });
  document.getElementById('audioRew').addEventListener('click', function() {
    audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
  });
  document.getElementById('audioFwd').addEventListener('click', function() {
    audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 15);
  });

  // Caption source for this file (?srt= param > sidecar > embedded) —
  // detection defers itself, so this never delays the play() below.
  initCaptionsForTrack(url);

  // Album cover art for this track (folder image via the bridge) —
  // lookup defers itself too, so it never delays the play() below.
  updateAudioCoverArt(url);

  // Auto-play
  audioEl.play().then(function(){ notifyMediaState(true); }).catch(function(){});
  playBtn.textContent = '⏸';
  playBtn.classList.add('playing');
}

function toggleAudio() {
  var btn = document.getElementById('audioPlayBtn');

    prepareExclusivePlayback();
    audioEl.play().then(function(){ notifyMediaState(true); }).catch(function(){});

  } else {
    audioEl.pause(); btn.textContent = '▶'; btn.classList.remove('playing');
    notifyMediaState(false);
  }
}

// ── Caption engine (SRT + VTT sidecars, ?srt= param, embedded tracks) ──
//
// Cue format everywhere: [{start, end, text}] with fractional seconds —
// the exact shape the native EmbeddedCaptionExtractor produces, so all
// three sources feed the single render path in updateCaptions().
//
// Source priority: ?srt=/&captions= URL param > sidecar file in the
// playing file's folder (exact basename match first — Excalibur.srt next
// to "Excalibur" — else the folder's ONLY .srt/.vtt) > subtitle track
// embedded in the container via TapMedia.getEmbeddedCaptions().
var captionSeq = 0;   // bumps on every track change; stale async loads no-op

function loadSrtCaptions(url, seq, onFail) {
  fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(text) {
    if (seq !== undefined && seq !== captionSeq) return;   // stale track
    var cues = parseSrt(text);
    if (cues.length) { captions = cues; return; }
    if (onFail) onFail();
  }).catch(function(e){
    console.warn('Could not load captions:', e);
    if ((seq === undefined || seq === captionSeq) && onFail) onFail();
  });
}

// Parses BOTH SubRip (.srt) and WebVTT (.vtt). Same blank-line-separated
// block structure; VTT differs by an optional numeric index line,
// optional hours in timestamps, '.' millisecond separators, cue settings
// after the arrow, and WEBVTT/NOTE/STYLE/REGION header blocks — which
// contain no '-->' line and therefore fall through harmlessly.
function parseSrt(text) {
  var result = [];
  var src = String(text || '').replace(/^\uFEFF/, '')
              .replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  var timeRe = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[,.](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[,.](\d{1,3})/;
  function secs(h, m, s, ms) {
    return parseInt(h || '0', 10)*3600 + parseInt(m, 10)*60 + parseInt(s, 10) +
           parseInt((String(ms) + '00').slice(0, 3), 10)/1000;
  }
  src.split('\n\n').forEach(function(block) {
    var lines = block.trim().split('\n');
    // Timing line is line 1 (SRT index / VTT cue id above it) or line 0
    // (VTT cues without an id).
    var ti = -1;
    for (var i = 0; i < lines.length && i < 2; i++) {
      if (lines[i].indexOf('-->') !== -1) { ti = i; break; }
    }
    if (ti < 0) return;
    var match = lines[ti].match(timeRe);
    if (!match) return;
    var start = secs(match[1], match[2], match[3], match[4]);
    var end   = secs(match[5], match[6], match[7], match[8]);
    var content = lines.slice(ti + 1).join('\n').replace(/<[^>]+>/g, '').trim();
    if (!content || end <= start) return;
    result.push({ start: start, end: end, text: content });
  });
  return result;
}

// Find a sidecar .srt/.vtt for a library-relative media path via the
// bridge folder listing. Exact basename match wins (works for
// extensionless media files too); otherwise a folder with exactly ONE
// subtitle file is unambiguous enough to use. Returns the sidecar's
// library-relative path, or ''.
function findSidecarCaptionPath(relPath) {
  var TM = window.TapMedia;
  if (!relPath || !TM || typeof TM.listFolder !== 'function') return '';
  var data;
  try { data = JSON.parse(TM.listFolder(parentFolderOf(relPath))); }
  catch (_) { return ''; }
  if (!data || data.error || !data.entries) return '';
  var base = relPath.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  var subs = data.entries.filter(function(en) {
    return !!en && /\.(srt|vtt)$/i.test(en.name || '');
  });
  if (!subs.length) return '';
  for (var i = 0; i < subs.length; i++) {
    if (subs[i].name.replace(/\.[^.]+$/, '').toLowerCase() === base) {
      return subs[i].relativePath || '';
    }
  }
  return subs.length === 1 ? (subs[0].relativePath || '') : '';
}

// Media URL for a library-relative path: bridge helper first, manual
// fallback matching MediaFileInterceptor's /media/ route.
function mediaUrlForRelPath(relPath) {
  var TM = window.TapMedia;
  try {
    if (TM && typeof TM.getMediaUrl === 'function') {
      var u = TM.getMediaUrl(relPath);
      if (u) return u;
    }
  } catch (_) {}
  return 'https://appassets.androidplatform.net/media/' +
         relPath.split('/').map(encodeURIComponent).join('/');
}

// ── Audio cover art (#audioArt) ──────────────────────────────────────
// When an audio track plays, look in its folder for a cover image —
// cover/folder/front/album/art.* preferred, in that order, else ANY
// image in the folder — via the same bridge folder listing the
// sidecar-caption detector uses, and paint it into the #audioArt tile.
// Falls back to the 🎵 placeholder when the folder has no image (or no
// bridge). The lookup is cached per folder so prev/next inside an
// album never re-hits the bridge.
var coverArtSeq = 0;                            // bumps per track; stale lookups no-op
var coverArtFolderCache = Object.create(null);  // folder relPath → image relPath ('' = none)
var COVER_ART_BASENAMES = ['cover', 'folder', 'front', 'album', 'art'];
var COVER_ART_IMG_RE = /\.(jpe?g|png|gif|webp|bmp)$/i;

function findCoverArtPath(folderRel) {
  if (folderRel in coverArtFolderCache) return coverArtFolderCache[folderRel];
  var found = '';
  var TM = window.TapMedia;
  if (TM && typeof TM.listFolder === 'function') {
    var data = null;
    try { data = JSON.parse(TM.listFolder(folderRel)); } catch (_) {}
    if (data && !data.error && data.entries) {
      var images = data.entries.filter(function(en) {
        return !!en && COVER_ART_IMG_RE.test(en.name || '');
      });
      // Preferred basenames win in priority order (cover.jpg beats
      // front.png); failing all of those, any image in the folder is
      // better than the placeholder.
      for (var p = 0; p < COVER_ART_BASENAMES.length && !found; p++) {
        for (var i = 0; i < images.length; i++) {
          var base = images[i].name.replace(/\.[^.]+$/, '').toLowerCase();
          if (base === COVER_ART_BASENAMES[p]) {
            found = images[i].relativePath || '';
            break;
          }
        }
      }
      if (!found && images.length) found = images[0].relativePath || '';
    }
  }
  coverArtFolderCache[folderRel] = found;
  return found;
}

// Paint (or clear) the art tile. '' restores the 🎵 placeholder and the
// stylesheet's gradient background.
function setAudioArtImage(imgUrl) {
  var art = document.getElementById('audioArt');
  if (!art) return;
  var icon = art.querySelector('.icon');
  if (imgUrl) {
    art.style.backgroundImage = 'url("' + String(imgUrl).replace(/"/g, '%22') + '")';
    art.style.backgroundSize = 'cover';
    art.style.backgroundPosition = 'center';
    if (icon) icon.style.display = 'none';
  } else {
    art.style.backgroundImage = '';
    if (icon) icon.style.display = '';
  }
}

// (Re)resolve cover art for the track now loading. Called from
// initAudioPlayer and loadAudioTrack's fast swap path, so folder-queue
// and playlist advances refresh the art per track. listFolder is a
// synchronous bridge hop, so — like caption detection — the work is
// deferred off the load path and guarded by a sequence token.
function updateAudioCoverArt(url) {
  var seq = ++coverArtSeq;
  setTimeout(function() {
    if (seq !== coverArtSeq) return;
    // Same resolution chain the ‹ back button uses: queue/playlist
    // entries carry relativePath (via currentLibraryRelPath); plain
    // single-file mode derives it from the /media/ URL.
    var relPath = libraryRelPathFromUrl(url) || currentLibraryRelPath();
    var imgRel = relPath ? findCoverArtPath(parentFolderOf(relPath)) : '';
    if (!imgRel) { setAudioArtImage(''); return; }
    // Preload before painting so a missing/corrupt file falls back to
    // the 🎵 tile instead of a blank square.
    var imgUrl = mediaUrlForRelPath(imgRel);
    var probe = new Image();
    probe.onload  = function() { if (seq === coverArtSeq) setAudioArtImage(imgUrl); };
    probe.onerror = function() { if (seq === coverArtSeq) setAudioArtImage(''); };
    probe.src = imgUrl;
  }, 250);
}

// (Re)select the caption source for the track now loading. Called from
// initAudioPlayer/initVideoPlayer and the fast-path track loaders, so
// folder-queue and playlist advances re-run detection per track.
function initCaptionsForTrack(url) {
  var seq = ++captionSeq;
  captions = [];
  setCaptionLine('');
  // 1. Explicit ?srt=/&captions= param — applies to the originally
  //    requested file only (queue advances get fresh detection). If the
  //    param URL 404s (DualWebViewGroup guesses <basename>.srt for
  //    intercepted web videos), fall through to sidecar/embedded.
  if (captionUrl && url === mediaUrl) {
    loadSrtCaptions(captionUrl, seq, function() {
      detectSidecarOrEmbedded(url, seq);
    });
    return;
  }
  detectSidecarOrEmbedded(url, seq);
}

// Sidecar + embedded detection. The bridge calls are synchronous JS
// bridge hops — and getEmbeddedCaptions can demux a whole MKV subtitle
// track — so BOTH stages are deferred off the load path: the player UI
// paints and playback starts before any caption work runs.
function detectSidecarOrEmbedded(url, seq) {
  setTimeout(function() {
    if (seq !== captionSeq) return;
    var relPath = libraryRelPathFromUrl(url);
    // 2. Sidecar file next to the playing file.
    var sidecar = findSidecarCaptionPath(relPath);
    if (sidecar) {
      loadSrtCaptions(mediaUrlForRelPath(sidecar), seq);
      return;
    }
    // 3. Embedded subtitle track (MP4 mov_text, MKV/WebM-muxed SRT/VTT)
    //    via the native extractor. Returns cue JSON or "[]".
    var TM = window.TapMedia;
    if (!TM || typeof TM.getEmbeddedCaptions !== 'function') return;
    var source = relPath || url;
    setTimeout(function() {
      if (seq !== captionSeq) return;
      var raw;
      try { raw = TM.getEmbeddedCaptions(source); } catch (_) { return; }
      if (seq !== captionSeq) return;
      var cues;
      try { cues = JSON.parse(raw || '[]'); } catch (_) { return; }
      if (!Array.isArray(cues)) return;
      cues = cues.filter(function(c) {
        return c && typeof c.start === 'number' &&
               typeof c.end === 'number' && c.text;
      });
      if (cues.length) captions = cues;
    }, 350);
  }, 250);
}

// ── Active-cue render + dim-mode publish ──
// #captionText is the on-page render target (video overlay). The active
// line is ALSO published for the native dim-mode mask so the caption can
// carry into dim mode for audio AND video:
//   • push channel: MediaInterface.onDimCaption(line) — same channel the
//     YouTube dim-caption engine uses; native side gates it on masked
//     state + media-control-WebView ownership, so pushing while undimmed
//     is a harmless no-op.
//   • scrape channel: window.__tapMediaActiveCaption (JS global) and the
//     hidden #dimCaptionLine node, for evaluateJavascript polls.
var lastPublishedCaptionLine = null;
function setCaptionLine(line) {
  line = line || '';
  var el = document.getElementById('captionText');
  if (el && el.textContent !== line) el.textContent = line;
  if (line === lastPublishedCaptionLine) return;
  lastPublishedCaptionLine = line;
  window.__tapMediaActiveCaption = line;
  var mirror = document.getElementById('dimCaptionLine');
  if (mirror) mirror.textContent = line;
  try {
    if (window.MediaInterface && typeof MediaInterface.onDimCaption === 'function') {
      MediaInterface.onDimCaption(line);
    }
  } catch (_) {}
}

function updateCaptions(time) {
  if (!captionsEnabled || captions.length === 0) {
    if (lastPublishedCaptionLine) setCaptionLine('');
    return;
  }
  var active = captions.find(function(c){ return time >= c.start && time <= c.end; });
  setCaptionLine(active ? active.text : '');
}

// ══════════════════════════════════════════════
// ══════ GESTURE CONTROLS ════════════════════
// ══════════════════════════════════════════════
var lastTapTime = 0;
var tapTimeout = null;

document.addEventListener('click', function(e) {
  // Don't intercept control button clicks
  if (e.target.closest('.ctrl-btn,.audio-btn,.vid-btn,input[type="range"],button,a,select')) return;

  var now = Date.now();
  if (now - lastTapTime < 350) {
    // Double tap → exit
    clearTimeout(tapTimeout);
    lastTapTime = 0;
    exitPlayer();
    return;
  }
  lastTapTime = now;
  tapTimeout = setTimeout(function() {
    // Single tap → pause/play
    singleTapAction();
  }, 350);
});

window.tapInsightTogglePlayback = function() {
  if (mediaType === 'text') {
    toggleTts();
    return ttsPlaying ? 'text-playing' : 'text-paused';
  }
  else if (mediaType === 'audio' || (mediaType === 'playlist' && !videoPlayerActive())) {
    toggleAudio();
    return audioEl.paused ? 'audio-paused' : 'audio-playing';
  }
  else if (mediaType === 'video' || (mediaType === 'playlist' && videoPlayerActive())) {
    toggleVideo();
    return videoEl.paused ? 'video-paused' : 'video-playing';
  }
  return 'unsupported:' + mediaType;
};

function singleTapAction() {
  if (mediaType === 'text') { toggleTts(); }
  else if (mediaType === 'audio') { toggleAudio(); }
  else if (mediaType === 'playlist') { window.tapInsightTogglePlayback(); }
  else if (mediaType === 'video') {
    if (videoOverlay.classList.contains('visible') || videoEl.paused) {
      toggleVideo();
    } else {
      showVideoOverlay();
    }
  }
}

function exitPlayer() {
  // Stop all media
  stopTts();
  audioEl.pause();
  videoEl.pause();
  notifyMediaState(false);
  try { setCaptionLine(''); } catch(_){}
  // Notify Android if interface exists
  if (window.AndroidInterface && typeof AndroidInterface.exitMediaPlayer === 'function') {
    AndroidInterface.exitMediaPlayer();
  } else if (window.history.length > 1) {
    window.history.back();
  } else {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#888;font-size:16px">Double-tapped to exit. Close this tab.</div>';
  }
}

// ══════════════════════════════════════════════
// ══════ ‹ BACK TO LIBRARY ═══════════════════
// ══════════════════════════════════════════════
// The pinned top-left back button stops playback cleanly and returns to
// library_local.html, deep-linked (?folder=…) into the EXACT folder the
// playing file lives in. Distinct from double-tap exit (exitPlayer):
// that hands control back to native; this is an in-WebView navigation
// back into the library at the right spot. Same virtual https origin as
// the library hand-off in the other direction.
var LIBRARY_URL = 'https://appassets.androidplatform.net/assets/library_local.html';

// Library-relative path of a /media/ URL served by the asset host
// (https://appassets.androidplatform.net/media/<rel>); '' for anything
// else (remote http(s) media, content: URIs, bridge-injected text).
function libraryRelPathFromUrl(u) {
  var m = String(u || '').match(/^https?:\/\/appassets\.androidplatform\.net\/media\/([^?#]+)/);
  if (!m) return '';
  try { return m[1].split('/').map(decodeURIComponent).join('/'); }
  catch (_) { return m[1]; }
}

function parentFolderOf(rel) {
  rel = String(rel || '').replace(/\/+$/, '');
  var i = rel.lastIndexOf('/');
  return i > 0 ? rel.slice(0, i) : '';
}

// Resolve the library-relative path of whatever is playing right now:
// queue/playlist entries carry relativePath; single-file mode derives it
// from the /media/ URL; full playlist mode can fall back to the .m3u's
// own path so Back lands in the folder containing the playlist.
function currentLibraryRelPath() {
  try {
    var entry = (playOrder && playOrder.length) ? currentEntry() : null;
    if (entry && entry.relativePath) return entry.relativePath;
    if (entry && entry.url) {
      var fromEntry = libraryRelPathFromUrl(entry.url);
      if (fromEntry) return fromEntry;
    }
  } catch (_) {}
  var fromUrl = libraryRelPathFromUrl(mediaUrl);
  if (fromUrl) return fromUrl;
  return playlistPath || '';
}

function backToLibrary() {
  // Stop everything the same way double-tap exit does, then navigate.
  try { stopTts(); } catch (_) {}
  try { audioEl.pause(); } catch (_) {}
  try { videoEl.pause(); } catch (_) {}
  notifyMediaState(false);
  try { setCaptionLine(''); } catch (_) {}
  var folder = parentFolderOf(currentLibraryRelPath());
  window.location.href = LIBRARY_URL +
    (folder ? '?folder=' + encodeURIComponent(folder) : '');
}

document.getElementById('backBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  backToLibrary();
});

// ══════════════════════════════════════════════
// ══════ KEYBOARD SHORTCUTS ══════════════════
// ══════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  var key = e.key;
  if (key === ' ' || key === 'k') { e.preventDefault(); singleTapAction(); }
  else if (key === 'Escape') { exitPlayer(); }
  else if (key === 'ArrowLeft') {
    if (mediaType === 'audio') audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
    else if (mediaType === 'video') videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
  }
  else if (key === 'ArrowRight') {
    if (mediaType === 'audio') audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 15);
    else if (mediaType === 'video') videoEl.currentTime = Math.min(videoEl.duration, videoEl.currentTime + 10);
  }
  else if (key === 'f' && mediaType === 'video') {
    if (document.fullscreenElement) document.exitFullscreen();
    else videoEl.requestFullscreen().catch(function(){});
  }
  else if (key === 'c' && mediaType === 'video') {
    captionsEnabled = !captionsEnabled;
    document.getElementById('videoCCBtn').style.opacity = captionsEnabled ? 1 : 0.4;
    if (!captionsEnabled) setCaptionLine('');  // clears render + dim publish
  }
});

// ══════════════════════════════════════════════
// ══════ PLAYLIST MODE ═══════════════════════
// ══════════════════════════════════════════════
var playlistMode = false;
var playlistEntries = [];       // [{title, url, kind, relativePath}]
var playOrder = [];             // array of indexes into playlistEntries
var currentOrderIdx = 0;        // index into playOrder
var shuffleOn = false;
var repeatMode = 'off';         // 'off' | 'all' | 'one'
var playlistName = '';
var playlistConsecutiveFailures = 0;
var playlistFailureSkipPending = false;

// URL parameters specific to playlist mode
var playlistPath = params.get('playlist') || '';
var sessionToken = params.get('token') || '';
// "bridge" = load playlist via window.TapMedia (on-glasses, no server).
// Anything else (including unset) = fall back to companion HTTP server.
var playlistSource = (params.get('source') || '').toLowerCase();
// Optional start index (0-based) into the playlist — lets the library hand off
// to the player at the exact track the user clicked.
var playlistStart = parseInt(params.get('start') || '0', 10);
if (!isFinite(playlistStart) || playlistStart < 0) playlistStart = 0;
// Companion server URL. On the glasses, the server binds to 127.0.0.1:19110.
// Override via &server=https://…:19110 if the browser reaches it elsewhere.
var companionBase = params.get('server') || 'https://127.0.0.1:19110';

function restoreShuffleRepeat() {
  try {
    var s = sessionStorage.getItem('player_shuffle');
    var r = sessionStorage.getItem('player_repeat');
    if (s === '1') shuffleOn = true;
    if (r === 'all' || r === 'one') repeatMode = r;
  } catch(e){}
}
function saveShuffleRepeat() {
  try {
    sessionStorage.setItem('player_shuffle', shuffleOn ? '1' : '0');
    sessionStorage.setItem('player_repeat', repeatMode);
  } catch(e){}
}

function initPlaylistMode() {
  playlistMode = true;
  document.getElementById('plBar').classList.add('active');
  restoreShuffleRepeat();

  var shuffleBtn = document.getElementById('plShuffleBtn');
  var repeatBtn = document.getElementById('plRepeatBtn');
  shuffleBtn.addEventListener('click', function() {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active', shuffleOn);
    rebuildPlayOrder();
    saveShuffleRepeat();
    // Drop focus so :hover/:focus doesn't visually mask .active on touch.
    try { shuffleBtn.blur(); } catch(_){}
  });
  repeatBtn.addEventListener('click', function() {
    repeatMode = (repeatMode === 'off') ? 'all'
               : (repeatMode === 'all') ? 'one' : 'off';
    repeatBtn.textContent = (repeatMode === 'one') ? '🔂' : '🔁';
    repeatBtn.classList.toggle('active', repeatMode !== 'off');
    repeatBtn.title = 'Repeat ' + repeatMode;
    saveShuffleRepeat();
    try { repeatBtn.blur(); } catch(_){}
  });
  shuffleBtn.classList.toggle('active', shuffleOn);
  repeatBtn.textContent = (repeatMode === 'one') ? '🔂' : '🔁';
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
  repeatBtn.title = 'Repeat ' + repeatMode;

  document.getElementById('plPrevBtn').addEventListener('click', playPrev);
  document.getElementById('plNextBtn').addEventListener('click', playNext);
  document.getElementById('plQueueBtn').addEventListener('click', toggleDrawer);
  document.getElementById('plDrawerClose').addEventListener('click', closeDrawer);

  // ALSO reveal + wire the bottom-bar ⏮/⏭ buttons that folder-queue
  // mode uses. Playlist mode and folder-queue mode share the same
  // playPrev / playNext functions, so the buttons are interchangeable;
  // the only difference is whether the top plBar is shown. With the
  // bottom buttons live in both modes the user gets a consistent
  // place to skip tracks regardless of how they entered the queue.
  ['audioPrevTrack', 'videoPrevTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) { b.style.display = ''; b.addEventListener('click', function(){ playPrev(); }); }
  });
  ['audioNextTrack', 'videoNextTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) { b.style.display = ''; b.addEventListener('click', function(){ playNext(); }); }
  });
  // Initial enabled-state pass; subsequent updates happen inside
  // playAt() via updateFolderQueueButtons().
  updateFolderQueueButtons();

  fetchPlaylist();
}

/**
 * Folder-queue mode: reuses the playlist navigation infrastructure
 * (playlistEntries, playOrder, playPrev, playNext) without the full
 * playlist UI (plBar, drawer, shuffle/repeat buttons). Triggered by
 * library_local.html stashing a folder's playable siblings into
 * sessionStorage('mediaPlayerQueue') and adding ?hasQueue=1 to the
 * media_player.html URL.
 *
 * Difference from initPlaylistMode():
 *   • playlistMode stays FALSE — keeps the audio panel layout simple
 *     (no plBar at the top, no shuffle/repeat header).
 *   • The new ⏮ / ⏭ buttons in #audioControls become visible and are
 *     wired to the same playPrev / playNext as full playlist mode.
 *   • playlistEntries + playOrder + currentOrderIdx are populated so
 *     auto-advance, end-of-track handling, and prev/next math just
 *     work with no special-casing.
 */
function initFolderQueueIfPresent() {
  if (params.get('hasQueue') !== '1') return;
  var raw;
  try { raw = sessionStorage.getItem('mediaPlayerQueue'); } catch(_){ raw = null; }
  if (!raw) return;
  var stash;
  try { stash = JSON.parse(raw); } catch(_){ return; }
  if (!stash || !Array.isArray(stash.entries) || !stash.entries.length) return;

  // Mirror applyPlaylist's entry shape so every downstream function
  // (playAt, currentEntry, handlePlaylistTrackFailure, etc.) sees the
  // exact fields it expects.
  playlistEntries = stash.entries
    .filter(function(e){ return !!e && !!e.url; })
    .map(function(e){
      return {
        title: e.title || '',
        url:   e.url,
        kind:  (e.kind || 'audio').toLowerCase(),
        relativePath: e.relativePath || ''
      };
    });
  if (!playlistEntries.length) return;

  // Find the entry that matches the URL we were asked to load — that's
  // our current index. Falls back to stash.startIndex when the match
  // misses (e.g., URL-encoding differences).
  var targetUrl = mediaUrl || '';
  var currentIdx = -1;
  for (var i = 0; i < playlistEntries.length; i++) {
    if (playlistEntries[i].url === targetUrl) { currentIdx = i; break; }
  }
  if (currentIdx < 0) {
    currentIdx = (typeof stash.startIndex === 'number')
      ? Math.max(0, Math.min(stash.startIndex, playlistEntries.length - 1))
      : 0;
  }

  // Build a simple sequential play order — no shuffle in folder-queue
  // mode; the user can still pick shuffle inside full playlist mode if
  // they need it.
  playOrder = [];
  for (var j = 0; j < playlistEntries.length; j++) playOrder.push(j);
  currentOrderIdx = currentIdx;
  playlistName = stash.name || 'Folder';

  // Reveal the prev / next buttons in BOTH the audio panel and the
  // video bottom-bar, and wire them to playPrev / playNext. The
  // queue can contain a mix of audio + video, so playAt's existing
  // mode-switching logic handles the transition between them.
  ['audioPrevTrack', 'videoPrevTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) { b.style.display = ''; b.addEventListener('click', function(){ playPrev(); }); }
  });
  ['audioNextTrack', 'videoNextTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (b) { b.style.display = ''; b.addEventListener('click', function(){ playNext(); }); }
  });
  // Refresh disabled-state for the buttons; updateFolderQueueButtons is
  // also called every time playAt() runs to keep them in sync as the
  // user moves through the queue.
  updateFolderQueueButtons();

  // Bump play order forward when the current track ends — folder-queue
  // mode wants implicit auto-advance just like playlist mode. Idempotent
  // guard prevents double-advance if both fire (audio + video both fire
  // 'ended' if the user switches modes mid-queue).
  function onTrackEnded() {
    if (folderQueueAdvanceFired) return;
    folderQueueAdvanceFired = true;
    setTimeout(function(){ folderQueueAdvanceFired = false; }, 1000);
    playNext();
  }
  audioEl.addEventListener('ended', onTrackEnded);
  if (typeof videoEl !== 'undefined' && videoEl) {
    videoEl.addEventListener('ended', onTrackEnded);
  }

  // Mark _audioInit / _videoInit so that the FIRST follow-up call to
  // loadAudioTrack / loadVideoTrack (triggered by playAt → playNext or
  // playPrev) takes the fast swap-src path instead of re-running
  // initAudioPlayer / initVideoPlayer (which would double-register
  // every listener: 'ended', 'error', 'loadedmetadata', etc.).
  // initAudioPlayer(mediaUrl) is still called once by the main
  // DOMContentLoaded path right after this function returns, so the
  // listeners are guaranteed to exist before any track switch.
  _audioInit = true;
  _videoInit = true;
}

var folderQueueAdvanceFired = false;

/**
 * Keep the ⏮/⏭ button enabled-state in sync with our position in the
 * queue. Called from initFolderQueueIfPresent and patched into playAt
 * (see the small hook below).
 */
function updateFolderQueueButtons() {
  var hasPrev = currentOrderIdx > 0 || repeatMode === 'all';
  var hasNext = currentOrderIdx < (playOrder.length - 1) || repeatMode === 'all';
  ['audioPrevTrack', 'videoPrevTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (!b || b.style.display === 'none') return;
    b.disabled = !hasPrev;
    b.style.opacity = hasPrev ? '1' : '0.4';
  });
  ['audioNextTrack', 'videoNextTrack'].forEach(function(id) {
    var b = document.getElementById(id);
    if (!b || b.style.display === 'none') return;
    b.disabled = !hasNext;
    b.style.opacity = hasNext ? '1' : '0.4';
  });
}

// Hand the parsed playlist into the player. Shared by bridge + HTTP loaders.
function applyPlaylist(data) {
  playlistName = (data && data.name) || 'Playlist';
  playlistConsecutiveFailures = 0;
  playlistEntries = ((data && data.entries) || []).map(function(e) {
    // Two shapes are supported:
    //   • HTTP /api/library/playlist   → { url, title, kind, relativePath }
    //   • TapMedia.parsePlaylist()     → { playUrl, title, kind,
    //                                      resolvedRelativePath, rawPath,
    //                                      isAbsoluteUrl }
    var absUrl = e.playUrl || e.url || '';
    if (absUrl && absUrl.indexOf('/') === 0) {
      // Companion-server relative path — make absolute against the companion.
      absUrl = companionBase + absUrl;
    }
    return {
      title: e.title || '',
      url: absUrl,
      kind: (e.kind || 'OTHER').toLowerCase(),
      relativePath: e.resolvedRelativePath || e.relativePath || e.rawPath || ''
    };
  }).filter(function(e){ return !!e.url; });

  if (playlistEntries.length === 0) {
    showError('Playlist is empty.');
    return;
  }
  document.getElementById('plName').textContent = playlistName;
  rebuildPlayOrder();
  // Clamp requested start index to the available queue and honor it.
  var startIdx = playlistStart;
  if (startIdx >= playOrder.length) startIdx = 0;
  // When shuffle is on, rebuildPlayOrder already put the "current" entry at
  // the front (index 0), so respecting playlistStart only matters in the
  // non-shuffle case. In shuffle mode, playlistStart becomes the "seed"
  // track — find its position in the shuffled order.
  if (shuffleOn) {
    var pos = playOrder.indexOf(startIdx);
    currentOrderIdx = pos >= 0 ? pos : 0;
  } else {
    currentOrderIdx = startIdx;
  }
  renderQueue();
  playAt(currentOrderIdx);
}

function fetchPlaylist() {
  if (!playlistPath) { showError('No playlist specified.'); return; }
  diag('fetchPlaylist  path=' + playlistPath + ' source=' + playlistSource);

  // Prefer the on-glasses bridge when this page is opened from the library
  // (source=bridge), or whenever the bridge is available and we have no
  // companion session token. Falls back to the companion HTTP server
  // otherwise — so the same page works from companion and on-glasses.
  var bridge = window.TapMedia;
  var useBridge = (playlistSource === 'bridge') ||
                  (bridge && typeof bridge.parsePlaylist === 'function' && !sessionToken);
  diag('bridge=' + (bridge ? 'yes' : 'no') + ' useBridge=' + useBridge);
  if (useBridge) {
    if (!bridge || typeof bridge.parsePlaylist !== 'function') {
      showError('Media bridge unavailable.');
      return;
    }
    var data;
    try {
      var raw = bridge.parsePlaylist(playlistPath);
      diag('bridge.parsePlaylist returned ' + (raw ? raw.length : 0) + ' chars');
      data = JSON.parse(raw);
    } catch (e) {
      showError('Could not load playlist: ' + (e && e.message || e));
      return;
    }
    if (data && data.error) { showError(data.error); return; }
    diag('playlist entries=' + (data && data.entries ? data.entries.length : 0));
    applyPlaylist(data);
    return;
  }

  var url = companionBase + '/api/library/playlist?path=' + encodeURIComponent(playlistPath) +
            '&token=' + encodeURIComponent(sessionToken);
  fetch(url, { headers: sessionToken ? { 'X-Session-Token': sessionToken } : {} })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(applyPlaylist)
    .catch(function(e) { showError('Could not load playlist: ' + e.message); });
}

function rebuildPlayOrder() {
  var order = [];
  for (var i = 0; i < playlistEntries.length; i++) order.push(i);
  if (shuffleOn) {
    // Preserve the currently-playing entry at front, shuffle the rest
    var cur = playOrder.length > 0 ? playOrder[currentOrderIdx] : 0;
    order = order.filter(function(i){ return i !== cur; });
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = order[j]; order[j] = order[k]; order[k] = t;
    }
    order.unshift(cur);
    currentOrderIdx = 0;
  } else {
    // Unshuffle — keep current track, return to natural order starting from it
    var curEntry = playOrder.length > 0 ? playOrder[currentOrderIdx] : 0;
    currentOrderIdx = curEntry;
  }
  playOrder = order;
  renderQueue();
}

function currentEntry() {
  return playlistEntries[playOrder[currentOrderIdx]] || null;
}

function playAt(orderIdx) {
  if (orderIdx < 0 || orderIdx >= playOrder.length) return;
  currentOrderIdx = orderIdx;
  var entry = currentEntry();
  if (!entry) return;
  playlistFailureSkipPending = false;
  clearError();
  showLoading('Loading ' + (entry.title || 'track') + '...');

  // Update the top bar
  document.getElementById('plIdxLabel').textContent =
    (currentOrderIdx + 1) + '/' + playOrder.length;
  document.getElementById('plTrackTitle').textContent = entry.title || 'Track';
  document.getElementById('plPrevBtn').disabled =
    (currentOrderIdx === 0 && repeatMode !== 'all');
  document.getElementById('plNextBtn').disabled =
    (currentOrderIdx >= playOrder.length - 1 && repeatMode !== 'all');

  // Update per-track title displays
  mediaTitle = entry.title || mediaTitle;
  // Mirror the active track title onto document.title so the glasses'
  // dim-mode label resolver can read it via WebView.title — same
  // mechanism we use for YouTube. Without this update, advancing to
  // the next track in a folder queue or playlist would leave the
  // mask HUD stuck on the first track's name.
  try { if (mediaTitle) document.title = mediaTitle; } catch (_) {}

  // Switch mode + load track
  if (entry.kind === 'video') {
    switchToVideoMode();
    loadVideoTrack(entry.url, entry.title);
  } else {
    // Default audio (works for audio + unknown)
    switchToAudioMode();
    loadAudioTrack(entry.url, entry.title);
  }

  renderQueue();
  // Folder-queue mode (non-playlistMode) also uses the ⏮/⏭ buttons —
  // refresh their enabled state so the user sees when they've hit
  // an edge of the queue. No-op in single-file mode (buttons hidden).
  try { updateFolderQueueButtons(); } catch(_){}
}

function handlePlaylistTrackFailure(kind, detail, url) {
  if (!playlistMode || !playOrder.length) return false;
  if (playlistFailureSkipPending) return true;
  var entry = currentEntry();
  var label = entry && (entry.title || entry.relativePath || entry.url) || url || 'track';
  playlistConsecutiveFailures += 1;
  if (playlistConsecutiveFailures >= playOrder.length) {
    showError('Could not play any entries in this playlist. Last failed: ' + label + ' (' + detail + ').');
    return true;
  }

  if (currentOrderIdx + 1 < playOrder.length) {
    playlistFailureSkipPending = true;
    document.getElementById('loadingText').textContent =
      'Skipping unavailable stream: ' + label;
    setTimeout(function() {
      playAt(currentOrderIdx + 1);
    }, 250);
    return true;
  }

  showError('Could not load ' + label + ' (' + detail + ').');
  return true;
}

function playNext() {
  if (playOrder.length === 0) return;
  if (currentOrderIdx + 1 < playOrder.length) {
    playAt(currentOrderIdx + 1);
  } else if (repeatMode === 'all') {
    playAt(0);
  }
}
function playPrev() {
  if (playOrder.length === 0) return;
  // If more than 3s into track, restart instead of prev — this is the
  // button-UX heuristic (matches what most music apps do when you tap
  // the ⏮ button mid-track). Glasses swipes use gesturePrevTrack()
  // below to bypass this and always navigate.
  var el = videoPlayerActive() ? videoEl : audioEl;
  if (el && el.currentTime > 3) {
    el.currentTime = 0;
    return;
  }
  if (currentOrderIdx > 0) {
    playAt(currentOrderIdx - 1);
  } else if (repeatMode === 'all') {
    playAt(playOrder.length - 1);
  } else {
    el.currentTime = 0;
  }
}

// ── Gesture entry points (called from glasses swipes) ─────────────────
//
// Distinct from the button playNext/playPrev because:
//
//   * They always navigate to the next/prev TRACK, never restart the
//     current one. The "restart if >3s in" rule that lives in playPrev
//     is right for a thumb on a button, wrong for a wrist swipe — the
//     user wants the same outcome whether they swipe at 0:02 or 2:00.
//
//   * They wrap around at queue boundaries even when repeatMode is
//     "off" — a swipe past the end of the queue shouldn't be a no-op,
//     it should land you on the first track.
//
//   * They return a small status string the Kotlin caller logs, so we
//     can tell from logcat whether a gesture fired through, was a
//     no-op (no queue), or hit an exception.
//
// Exposed on window so DualWebViewGroup can reach them via
// evaluateJavascript without needing a JS bridge.
window.gestureNextTrack = function() {
  if (!playOrder || playOrder.length === 0) return 'no-queue';
  var n = playOrder.length;
  var nextIdx = (currentOrderIdx + 1) % n;
  playAt(nextIdx);
  return 'gesture-next';
};
window.gesturePrevTrack = function() {
  if (!playOrder || playOrder.length === 0) return 'no-queue';
  var n = playOrder.length;
  // (currentOrderIdx - 1 + n) % n handles 0 → last cleanly without
  // negative-modulo gotchas.
  var prevIdx = (currentOrderIdx - 1 + n) % n;
  playAt(prevIdx);
  return 'gesture-prev';
};

// ── Mode switching ───────────────────────────────────────────────────
function switchToAudioMode() {
  document.getElementById('videoPlayer').classList.remove('active');
  videoEl.pause();
  document.getElementById('audioPlayer').classList.add('active');
}
function switchToVideoMode() {
  document.getElementById('audioPlayer').classList.remove('active');
  audioEl.pause();
  document.getElementById('videoPlayer').classList.add('active');
}
function videoPlayerActive() {
  return document.getElementById('videoPlayer').classList.contains('active');
}

// ── Track load helpers (re-use listeners set up by init* functions) ──
var _audioInit = false, _videoInit = false;

function loadAudioTrack(url, title) {
  prepareExclusivePlayback();
  document.getElementById('audioTitle').textContent = title || 'Audio';
  if (!_audioInit) {
    initAudioPlayer(url);  // sets up listeners + loads (+ captions)
    _audioInit = true;
    return;
  }
  // Fast swap-src path skips initAudioPlayer, so re-run caption
  // detection AND cover-art resolution for the new track here.
  initCaptionsForTrack(url);
  updateAudioCoverArt(url);
  var loadSeq = ++audioLoadSeq;
  audioEl.dataset.loadSeq = String(loadSeq);
  audioEl.src = url;
  audioEl.load();
  audioEl.play().then(function() {
    notifyMediaState(true);
    var btn = document.getElementById('audioPlayBtn');
    btn.textContent = '⏸'; btn.classList.add('playing');
  }).catch(function(){});
  setTimeout(function(){
    if (audioEl.dataset.loadSeq === String(loadSeq) &&
        !document.getElementById('loadingOverlay').classList.contains('hidden')) {
      if (!handlePlaylistTrackFailure('audio', 'load timed out', url)) {
        showError('Audio load timed out. URL: ' + url);
      }
    }
  }, 15000);
}
function loadVideoTrack(url, title) {
  prepareExclusivePlayback();
  document.getElementById('videoTitle').textContent = title || 'Video';
  if (!_videoInit) {
    initVideoPlayer(url);  // sets up listeners + loads (+ captions)
    _videoInit = true;
    return;
  }
  // Fast swap-src path skips initVideoPlayer, so re-run caption
  // detection for the new track here.
  initCaptionsForTrack(url);
  var loadSeq = ++videoLoadSeq;
  videoEl.dataset.loadSeq = String(loadSeq);
  videoEl.src = url;
  videoEl.load();
  videoEl.play().then(function() {
    notifyMediaState(true);
    var btn = document.getElementById('videoPlayBtn');
    btn.textContent = '⏸'; btn.classList.add('playing');
    hideVideoOverlayDelayed();
  }).catch(function(){});
  setTimeout(function(){
    if (videoEl.dataset.loadSeq === String(loadSeq) &&
        !document.getElementById('loadingOverlay').classList.contains('hidden')) {
      if (!handlePlaylistTrackFailure('video', 'load timed out', url)) {
        showError('Video load timed out. URL: ' + url);
      }
    }
  }, 15000);
}

// ── Auto-advance hooks (installed after the regular 'ended' handlers) ──
function installPlaylistEndHooks() {
  audioEl.addEventListener('ended', function() {
    if (!playlistMode) return;
    if (repeatMode === 'one') { audioEl.currentTime = 0; audioEl.play(); return; }
    playNext();
  });
  videoEl.addEventListener('ended', function() {
    if (!playlistMode) return;
    if (repeatMode === 'one') { videoEl.currentTime = 0; videoEl.play(); return; }
    playNext();
  });
}

// ── Queue drawer ─────────────────────────────────────────────────────
function toggleDrawer() {
  document.getElementById('plDrawer').classList.toggle('open');
}
function closeDrawer() {
  document.getElementById('plDrawer').classList.remove('open');
}

function renderQueue() {
  var list = document.getElementById('plQueueList');
  list.innerHTML = '';
  playOrder.forEach(function(origIdx, orderIdx) {
    var entry = playlistEntries[origIdx];
    if (!entry) return;
    var row = document.createElement('div');
    row.className = 'q-item' + (orderIdx === currentOrderIdx ? ' current' : '');
    var kindIcon = entry.kind === 'video' ? '▶' : (entry.kind === 'audio' ? '♪' : '•');
    row.innerHTML =
      '<span class="q-num"></span>' +
      '<span class="q-icon">' + kindIcon + '</span>' +
      '<span class="q-title"></span>';
    row.querySelector('.q-num').textContent = (orderIdx + 1);
    row.querySelector('.q-title').textContent = entry.title || entry.relativePath || 'Track';
    row.addEventListener('click', function() { playAt(orderIdx); closeDrawer(); });
    list.appendChild(row);
  });
}

// ══════════════════════════════════════════════
// ══════ INIT ════════════════════════════════
// ══════════════════════════════════════════════
// TTS on the glasses is routed through Gemini 3.1 via window.TapMedia.speakText().
// The browser SpeechSynthesis API is used only as a fallback when the bridge
// isn't present (e.g., the companion-app web viewer). Never reference the
// speechSynthesis global directly at parse time — RayNeo's WebView doesn't
// expose it and a bare reference throws ReferenceError at script-load, halting
// all subsequent init (including the DOMContentLoaded listener that assigns
// the media <audio>/<video> src).
try {
  if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis &&
      typeof window.speechSynthesis.getVoices === 'function' &&
      window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.addEventListener('voiceschanged', function(){}, { once: true });
  }
} catch (e) { /* speechSynthesis unavailable on this WebView — Gemini bridge handles TTS */ }

function initFromTextContent() {
  // Check the window variable (legacy injection path)
  if (window._textContent && typeof window._textContent === 'string') {
    if (!window._textContent.trim()) { showError('File is empty.'); return true; }
    initTextReader(window._textContent);
    return true;
  }
  return false;
}

function tryPullFromBridge() {
  // Pull text from Android bridge (preferred — no race conditions).
  // The bridge stores text before loading this page, so it's always ready.
  var bridge = window.AndroidInterface || window.MediaInterface;
  if (bridge && typeof bridge.getPendingText === 'function') {
    try {
      var text = bridge.getPendingText();
      if (text && text.trim().length > 0) {
        initTextReader(text);
        return true;
      }
    } catch(e) { console.warn('Bridge getPendingText failed:', e); }
  }
  return false;
}

window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loadingText').textContent = 'Loading ' + mediaType + '...';
  diag('DOMContentLoaded  type=' + mediaType);
  if (mediaType === 'playlist' || mediaType === 'text' || mediaType === 'audio' || mediaType === 'video') {
    prepareExclusivePlayback();
  }

  if (mediaType === 'playlist') {
    installPlaylistEndHooks();
    initPlaylistMode();
    return;
  }

  if (mediaType === 'text') {
    // 1. Try pulling text from Android bridge (best — always ready)
    if (tryPullFromBridge()) return;
    // 2. Check if text was already injected into window._textContent
    if (initFromTextContent()) return;
    // 3. If we have a URL (library flow), fetch directly — no need to wait
    //    for a bridge that isn't coming.
    if (mediaUrl) {
      diag('text: fetching ' + mediaUrl.substring(0, 60));
      fetch(mediaUrl).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(text) {
        if (!text.trim()) { showError('File is empty.'); return; }
        initTextReader(text);
      }).catch(function(e) { showError('Could not load file: ' + e.message); });
      return;
    }
    // 4. No URL and no bridge text yet — poll briefly for injected text
    //    (covers legacy paths that call loadUrl() + inject on load).
    var waitCount = 0;
    var waitTimer = setInterval(function() {
      if (tryPullFromBridge()) { clearInterval(waitTimer); return; }
      if (initFromTextContent()) { clearInterval(waitTimer); return; }
      waitCount++;
      if (waitCount > 30) {
        clearInterval(waitTimer);
        showError('No text content available.');
      }
    }, 100);
    return;

  } else if (!mediaUrl) {
    showError('No media URL provided.');
    return;

  } else if (mediaType === 'audio') {
    initFolderQueueIfPresent();
    initAudioPlayer(mediaUrl);

  } else if (mediaType === 'video') {
    initFolderQueueIfPresent();
    initVideoPlayer(mediaUrl);

  } else {
    showError('Unknown media type: ' + mediaType);
  }
});
</script>
